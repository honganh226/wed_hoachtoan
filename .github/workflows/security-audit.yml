name: Security checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts --prefix server
          npm ci --ignore-scripts --prefix client
      - name: Audit known dependency vulnerabilities
        run: |
          npm audit --audit-level=moderate --prefix server
          npm audit --audit-level=moderate --prefix client
      - name: Test security boundaries and Excel calculations
        run: |
          npm run test:security --prefix server
          npm run test:auth --prefix server
          npm run test:unit --prefix server
          node server/src/tests/excelImportDates.test.mjs
      - name: Build frontend
        run: npm run build --prefix client
      - name: Scan history for secrets locally
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}" -o "$archive"
          curl --fail --silent --show-error --location "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_checksums.txt" -o checksums.txt
          grep " ${archive}$" checksums.txt | sha256sum --check
          tar -xzf "$archive" gitleaks
          ./gitleaks git "$GITHUB_WORKSPACE" --redact --no-banner
